name: Part 2 - Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.slnx

    - name: Build solution
      run: dotnet build RaceDay.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal

    - name: Success message
      run: echo "Build and tests passed successfully"
